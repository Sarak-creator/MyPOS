version: "3.8"

services:
  # 1. Anachak POS Next.js App
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: anachak_pos_app
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://anachak_admin:SuperSecurePass2026@postgres:5432/anachak_pos?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=anachak-production-enterprise-secret-key-khmer-2026
      - NEXT_PUBLIC_BAKONG_ACCOUNT=anachak_pos@aba
      - NEXT_PUBLIC_DEFAULT_CURRENCY=USD
      - NEXT_PUBLIC_EXCHANGE_RATE_KHR=4100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - anachak_network

  # 2. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: anachak_pos_postgres
    restart: always
    environment:
      POSTGRES_USER: anachak_admin
      POSTGRES_PASSWORD: SuperSecurePass2026
      POSTGRES_DB: anachak_pos
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../prisma/migrations/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anachak_admin -d anachak_pos"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - anachak_network

  # 3. Redis Cache & Live Sync
  redis:
    image: redis:7-alpine
    container_name: anachak_pos_redis
    restart: always
    volumes:
      - redisdata:/data
    networks:
      - anachak_network

  # 4. Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: anachak_pos_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - anachak_network

networks:
  anachak_network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
