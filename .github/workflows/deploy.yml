name: Anachak POS Enterprise CI/CD

on:
  push:
    branches: ["main", "release/*"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anachak_test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: anachak_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://anachak_test:testpassword@localhost:5432/anachak_test
      DIRECT_URL: postgresql://anachak_test:testpassword@localhost:5432/anachak_test
      JWT_SECRET: test_secret_key_ci_cd

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Validate & Push Prisma Schema
        run: |
          npx prisma validate
          npx prisma db push --accept-data-loss --skip-generate

      - name: Build Production Next.js Bundle
        run: npm run build

  # ──────────────────────────────────────────────────────────────────────
  # This job deploys to a self-hosted VPS via SSH.
  # It will be SKIPPED automatically if the SERVER_HOST secret is not set.
  # To enable: add SERVER_HOST, SERVER_USER, SERVER_SSH_KEY in
  #   GitHub → Settings → Secrets → Actions
  # ──────────────────────────────────────────────────────────────────────
  deploy:
    needs: build-and-test
    # secrets cannot be evaluated in `if`; use a workaround via env
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Skip if no VPS server configured
        id: check_secret
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "No SERVER_HOST secret set — skipping VPS deployment."
            exit 0
          fi

      - name: Deploy to VPS Server via SSH
        if: ${{ secrets.SERVER_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/anachak-pos
            git pull origin main
            docker compose -f docker/docker-compose.yml up -d --build
            docker compose -f docker/docker-compose.yml exec -T app npx prisma migrate deploy
